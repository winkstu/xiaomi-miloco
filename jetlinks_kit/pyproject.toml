[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jetlinks_kit"
version = "0.1.0"
description = "JetLinks IoT Platform Integration Kit"
authors = []
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.12.14",
    "pydantic>=2.4.0",
    "fastmcp>=2.11",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["jetlinks*"]
